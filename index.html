<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Arenzhi Scent - Official Perfume Catalog & Store</title>
   <!-- Tailwind CSS CDN -->
   <script src="https://cdn.tailwindcss.com"></script>
   <!-- Supabase JS SDK CDN -->
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <!-- Lucide Icons -->
   <script src="https://unpkg.com/lucide@latest"></script>
   <!-- PWA Manifest Data URI -->
   <link rel="manifest" href='data:application/manifest+json,{"name":"Arenzhi Scent","short_name":"Arenzhi","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#0f172a","icons":[{"src":"https://api.iconify.design/lucide:sparkles.svg?color=%230f172a","sizes":"192x192","type":"image/svg+xml"}]}'>
   <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      
      /* CSS KHUSUS CETAK / PDF: Hanya elemen ber-ID printableInvoice yang akan tercetak sempurna */
      @media print {
         body * { visibility: hidden !important; }
         #printableInvoice, #printableInvoice * { visibility: visible !important; }
         #printableInvoice { 
            position: absolute !important; 
            left: 0 !important; 
            top: 0 !important; 
            width: 100% !important; 
            margin: 0 !important;
            padding: 20px !important;
            background: #ffffff !important;
         }
      }
   </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-slate-900 selection:text-white">

   <!-- HEADER / NAVIGATION -->
   <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs transition-all">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
         <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigate('home')">
             <div id="brandLogoContainer" class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-lg shadow-md overflow-hidden flex-shrink-0">
                  <span id="brandLogoInitial">A</span>
             </div>
             <div>
                  <h1 id="brandTitleText" class="font-bold text-base sm:text-lg text-slate-900 tracking-tight leading-none">Arenzhi Scent</h1>
                  <span class="text-[11px] text-slate-500 font-medium">Luxury Fragrance Store</span>
             </div>
         </div>

         <div class="flex items-center gap-2 sm:gap-3">
             <div class="relative hidden sm:block">
                 <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                     <i data-lucide="search" class="w-4 h-4"></i>
                 </span>
                 <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Cari aroma parfum..." class="pl-9 pr-4 py-2 bg-slate-100 border border-transparent rounded-full text-sm focus:bg-white focus:border-slate-900 focus:outline-none w-44 lg:w-64 transition-all">
             </div>

             <!-- Cart Button -->
             <button onclick="toggleCartModal(true)" class="relative p-2.5 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-700 transition-colors">
                 <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                 <span id="cartBadge" class="absolute -top-1 -right-1 bg-slate-900 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow-sm hidden">0</span>
             </button>

             <!-- Admin Mode Toggle -->
             <button onclick="openAdminAuthModal()" class="flex items-center gap-2 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-full text-xs font-semibold shadow-sm transition-all">
                 <i data-lucide="shield" class="w-3.5 h-3.5"></i>
                 <span class="hidden sm:inline">Admin Mode</span>
             </button>
         </div>
      </div>
   </header>

   <!-- MAIN CONTENT CONTAINER -->
   <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
       <div id="appView">
           <div class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 animate-pulse">
               <div class="bg-slate-200 h-72 rounded-2xl"></div>
               <div class="bg-slate-200 h-72 rounded-2xl"></div>
               <div class="bg-slate-200 h-72 rounded-2xl"></div>
               <div class="bg-slate-200 h-72 rounded-2xl"></div>
           </div>
       </div>
   </main>

   <!-- FOOTER -->
   <footer class="bg-white border-t border-slate-200 py-8 mt-16 text-center text-sm text-slate-500">
       <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
           <p>&copy; 2026 <span id="footerBrandName">Arenzhi Scent</span>. All rights reserved.</p>
           <div class="flex items-center gap-6 text-xs font-medium text-slate-600">
                <a href="#" onclick="router.navigate('home'); return false;" class="hover:text-slate-900">Katalog</a>
                <a href="#" onclick="toggleCartModal(true); return false;" class="hover:text-slate-900">Keranjang</a>
                <a href="#" onclick="openAdminAuthModal(); return false;" class="hover:text-slate-900">Panel Admin</a>
           </div>
       </div>
   </footer>

   <!-- CART SIDEBAR MODAL -->
   <div id="cartModal" class="fixed inset-0 z-50 overflow-hidden hidden">
       <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity" onclick="toggleCartModal(false)"></div>
       <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
           <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i data-lucide="shopping-bag" class="w-5 h-5 text-slate-900"></i>
                        <h3 class="font-bold text-lg text-slate-900">Keranjang Belanja</h3>
                    </div>
                    <button onclick="toggleCartModal(false)" class="p-2 text-slate-400 hover:text-slate-700 rounded-full">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-6 space-y-4 divide-y divide-slate-100"></div>
                <div class="p-6 border-t border-slate-100 bg-slate-50">
                    <div class="flex items-center justify-between mb-4 font-semibold text-slate-900">
                        <span>Subtotal</span>
                        <span id="cartSubtotalText">Rp 0</span>
                    </div>
                    <button onclick="proceedToCheckout()" class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-semibold shadow-md transition-all flex items-center justify-center gap-2">
                        <span>Lanjut ke Checkout</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
           </div>
       </div>
   </div>

   <!-- FLOATING BUTTONS CONTAINER -->
   <div id="floatingButtonsContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 items-end">
       <button onclick="shareStoreLink()" class="flex items-center justify-center w-12 h-12 bg-slate-900 hover:bg-slate-800 text-white rounded-full shadow-xl transition-all duration-300 hover:scale-110 group relative">
           <i data-lucide="share-2" class="w-5 h-5"></i>
           <span class="absolute right-14 bg-slate-900 text-white text-xs font-semibold px-3 py-1.5 rounded-xl shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap pointer-events-none">
               Bagikan Link Toko
           </span>
       </button>
       <a id="floatingWaBtn" href="#" target="_blank" class="flex items-center justify-center w-14 h-14 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full shadow-2xl transition-all duration-300 hover:scale-110 group relative">
           <i data-lucide="message-circle" class="w-7 h-7"></i>
           <span class="absolute right-16 bg-slate-900 text-white text-xs font-semibold px-3 py-1.5 rounded-xl shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap pointer-events-none">
               Konsultasi / Tanya Parfum
           </span>
       </a>
   </div>

   <!-- APPLICATION LOGIC SCRIPT -->
   <script>
       const SUPABASE_URL = "https://dnizwwfgocdrbevvsiyi.supabase.co";
       const SUPABASE_ANON_KEY = "sb_publishable_jvFwPfnF3xVKVCqkefItzA_GWMMFkwz";
       const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

       let state = {
           storeSettings: JSON.parse(localStorage.getItem('arenzhi_settings') || JSON.stringify({
               store_name: "Arenzhi Scent",
               store_logo_url: "",
               admin_wa_number: "6285855859088",
               store_address: "Dusun Sumberagung Desa Bandungrejo RT.57/RW.09 Kecamatan Bantur Kabupaten Malang Provinsi Jawa Timur Kode Pos (65179)",
               payment_info: "BRI: 786601020880538 a.n. Robiatul Adabiyah\nTransfer/QRIS Aktif",
               qris_image_url: ""
           })),
           products: [],
           orders: JSON.parse(localStorage.getItem('arenzhi_orders') || '[]'),
           cart: JSON.parse(localStorage.getItem('arenzhi_cart') || '[]'),
           guestProfile: JSON.parse(localStorage.getItem('arenzhi_guest') || '{}'),
           isAdmin: false,
           currentView: 'home',
           searchQuery: '',
           activeOrder: null
       };

       const shippingRatesByZone = {
           'jatim': { name: 'Jawa Timur (Sesama Prov)', jne: 10000, jnt: 12000, sicepat: 9000, pos: 8000 },
           'jateng_diy': { name: 'Jawa Tengah & DIY', jne: 16000, jnt: 18000, sicepat: 15000, pos: 12000 },
           'jabar_banten_dki': { name: 'Jabar, Banten & DKI Jakarta', jne: 18000, jnt: 20000, sicepat: 17000, pos: 14000 },
           'luar_jawa': { name: 'Luar Pulau Jawa (Sumatra/Bali/Dll)', jne: 35000, jnt: 40000, sicepat: 35000, pos: 30000 }
       };

       let currentZone = 'jatim';
       let currentCourier = 'JNE';
       let currentOngkir = 10000;

       document.addEventListener('DOMContentLoaded', async () => {
           await fetchProductsFromSupabase();
           loadLocalStorageGuestProfile();
           renderAppHeader();
           updateFloatingWaLink();
           router.navigate(state.currentView);
           updateCartBadge();
           lucide.createIcons();
       });

       function loadLocalStorageGuestProfile() {
           try {
               const saved = localStorage.getItem('arenzhi_guest');
               if (saved) state.guestProfile = JSON.parse(saved);
           } catch (e) { console.error(e); }
       }

       function openAdminAuthModal() {
           const password = prompt("Masukkan Password Admin:");
           if (password === "arenzhi2026" || password === "admin") {
               state.isAdmin = true;
               router.navigate('admin');
           } else if (password !== null) {
               alert("Password salah!");
           }
       }

       async function fetchProductsFromSupabase() {
           try {
               const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
               if (error) throw error;
               if (data && data.length > 0) {
                   state.products = data;
               } else {
                   state.products = [
                       { id: '1', title: 'Arenzhi Velvet Noir Extrait', size_ml: '50ml', description: 'Parfum mewah beraroma woody amber dengan sentuhan vanilla hangat dan musk eksklusif.', price_original: 450000, discount_percent: 20, price_final: 360000, is_promo: true, image_url: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=600', stock: 25 },
                       { id: '2', title: 'Arenzhi Celestial Rose', size_ml: '30ml', description: 'Keharuman bunga mawar Grasse berpadu segar dengan citrus dan white musk.', price_original: 380000, discount_percent: 0, price_final: 380000, is_promo: false, image_url: 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=600', stock: 15 },
                       { id: '3', title: 'Arenzhi Ocean Breeze Elixir', size_ml: '100ml', description: 'Aroma aquatic segar yang membangkitkan semangat dengan sentuhan marine salt dan cedarwood.', price_original: 420000, discount_percent: 15, price_final: 357000, is_promo: true, image_url: 'https://images.unsplash.com/photo-1541643600914-78b084683601?w=600', stock: 30 },
                       { id: '4', title: 'Arenzhi Amber Tobacco Royal', size_ml: '50ml', description: 'Kombinasi hangat tembakau lembut, rempah oriental, dan madu manis mewah.', price_original: 500000, discount_percent: 10, price_final: 450000, is_promo: true, image_url: 'https://images.unsplash.com/photo-1594035910387-fea47794261f?w=600', stock: 10 }
                   ];
               }
           } catch (err) {
               console.error("Gagal memuat produk:", err);
               state.products = JSON.parse(localStorage.getItem('arenzhi_products') || '[]');
           }
       }

       function updateFloatingWaLink() {
           const waNumber = state.storeSettings.admin_wa_number || "6285855859088";
           const defaultMsg = encodeURIComponent("Halo Admin " + state.storeSettings.store_name + ", saya ingin konsultasi seputar parfum.");
           const floatingBtn = document.getElementById('floatingWaBtn');
           if (floatingBtn) floatingBtn.href = `https://wa.me/${waNumber}?text=${defaultMsg}`;
       }

       function shareStoreLink() {
           const storeUrl = window.location.href;
           const storeName = state.storeSettings.store_name || "Arenzhi Scent";
           if (navigator.share) {
               navigator.share({
                   title: storeName,
                   text: `Temukan koleksi parfum mewah eksklusif di ${storeName}!`,
                   url: storeUrl,
               }).catch((error) => console.log('Error sharing:', error));
           } else {
               navigator.clipboard.writeText(storeUrl).then(() => {
                   alert('Link toko berhasil disalin ke clipboard! Silakan bagikan ke media sosial.');
               }).catch(() => {
                   prompt('Salin link toko berikut:', storeUrl);
               });
           }
       }

       function renderAppHeader() {
           const name = state.storeSettings.store_name || "Arenzhi Scent";
           document.getElementById('brandTitleText').innerText = name;
           document.getElementById('footerBrandName').innerText = name;
           const logoContainer = document.getElementById('brandLogoContainer');
           if (state.storeSettings.store_logo_url) {
               logoContainer.innerHTML = `<img src="${state.storeSettings.store_logo_url}" class="w-full h-full object-cover" alt="Logo">`;
           } else {
               logoContainer.innerHTML = `<span id="brandLogoInitial">${name.charAt(0).toUpperCase()}</span>`;
           }
           document.title = `${name} - Official Perfume Catalog & Store`;
       }

       const router = {
           navigate: (viewName, param = null) => {
               state.currentView = viewName;
               window.scrollTo(0, 0);
               const container = document.getElementById('appView');
               if (viewName === 'home') container.innerHTML = renderHomeView();
               else if (viewName === 'detail') container.innerHTML = renderDetailView(param);
               else if (viewName === 'checkout') container.innerHTML = renderCheckoutView();
               else if (viewName === 'payment') container.innerHTML = renderPaymentView(param);
               else if (viewName === 'admin') container.innerHTML = renderAdminView();
               else if (viewName === 'invoice') container.innerHTML = renderInvoiceView(param);
               lucide.createIcons();
           }
       };

       function handleSearch(query) {
           state.searchQuery = query;
           if (state.currentView === 'home') {
               document.getElementById('appView').innerHTML = renderHomeView();
               lucide.createIcons();
           }
       }

       function renderHomeView() {
           const filtered = state.products.filter(p => p.title.toLowerCase().includes(state.searchQuery.toLowerCase()));
           return `
               <div class="space-y-8">
                   <div class="relative bg-slate-900 rounded-3xl p-6 sm:p-12 text-white overflow-hidden shadow-xl flex flex-col justify-center min-h-[280px]">
                       <div class="relative z-10 max-w-xl space-y-4">
                           <span class="px-3 py-1 bg-white/10 backdrop-blur-md rounded-full text-xs font-semibold text-slate-200">Signature Collection 2026</span>
                           <h2 class="text-2xl sm:text-5xl font-extrabold tracking-tight">Temukan Aroma Khas <span class="text-amber-300">${state.storeSettings.store_name}</span></h2>
                           <p class="text-slate-300 text-xs sm:text-base">Racikan parfum eksklusif pilihan terbaik untuk karakter Anda.</p>
                       </div>
                   </div>
                   <div class="flex items-center justify-between">
                       <h3 class="font-bold text-lg sm:text-xl text-slate-900">Katalog Parfum</h3>
                       <span class="text-xs text-slate-500">${filtered.length} Produk Tersedia</span>
                   </div>
                   <div class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6">
                       ${filtered.map(p => `
                           <div class="bg-white rounded-2xl border border-slate-200 shadow-xs hover:shadow-lg transition-all overflow-hidden flex flex-col justify-between group">
                               <div class="relative aspect-square bg-slate-100 overflow-hidden cursor-pointer" onclick="router.navigate('detail', '${p.id}')">
                                   <img src="${p.image_url || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=600'}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                   ${p.is_promo && p.discount_percent > 0 ? `<span class="absolute top-3 left-3 bg-red-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-full">Diskon ${p.discount_percent}%</span>` : ''}
                               </div>
                               <div class="p-3 sm:p-4 space-y-2 flex-1 flex flex-col justify-between">
                                   <div>
                                       <h4 class="font-bold text-slate-900 text-xs sm:text-sm line-clamp-1 cursor-pointer hover:text-amber-600" onclick="router.navigate('detail', '${p.id}')">${p.title}</h4>
                                       <div class="mt-1 flex items-baseline gap-2">
                                           <span class="font-bold text-slate-950 text-sm sm:text-base">Rp ${Number(p.price_final).toLocaleString('id-ID')}</span>
                                           ${p.is_promo && p.price_original > p.price_final ? `<span class="text-[11px] text-slate-400 line-through">Rp ${Number(p.price_original).toLocaleString('id-ID')}</span>` : ''}
                                       </div>
                                   </div>
                                   <button onclick="addToCart('${p.id}')" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5">
                                       <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah
                                   </button>
                               </div>
                           </div>
                       `).join('')}
                   </div>
               </div>
           `;
       }

       function renderDetailView(productId) {
           const product = state.products.find(p => p.id === productId);
           if (!product) return `<div class="text-center py-20">Produk tidak ditemukan. <button onclick="router.navigate('home')" class="text-blue-600 underline">Kembali</button></div>`;
           return `
               <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-10 shadow-sm max-w-4xl mx-auto">
                   <button onclick="router.navigate('home')" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-slate-900 mb-6">
                       <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Katalog
                   </button>
                   <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                       <div class="aspect-square rounded-2xl overflow-hidden bg-slate-100 shadow-inner">
                           <img src="${product.image_url}" alt="${product.title}" class="w-full h-full object-cover">
                       </div>
                       <div class="space-y-6">
                           <div>
                               <div class="flex items-center gap-2 mb-2">
                                   ${product.size_ml ? `<span class="bg-slate-100 text-slate-800 text-xs font-bold px-2.5 py-1 rounded-md">Ukuran: ${product.size_ml}</span>` : ''}
                                   ${product.is_promo && product.discount_percent > 0 ? `<span class="bg-red-100 text-red-600 text-xs font-bold px-3 py-1 rounded-full">Diskon ${product.discount_percent}%</span>` : ''}
                               </div>
                               <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">${product.title}</h2>
                               <div class="mt-3 flex items-baseline gap-3">
                                   <span class="text-2xl font-bold text-slate-900">Rp ${Number(product.price_final).toLocaleString('id-ID')}</span>
                                   ${product.is_promo && product.price_original > product.price_final ? `<span class="text-sm text-slate-400 line-through">Rp ${Number(product.price_original).toLocaleString('id-ID')}</span>` : ''}
                               </div>
                           </div>
                           <p class="text-slate-600 text-sm leading-relaxed">${product.description || 'Tidak ada deskripsi.'}</p>
                           <button onclick="addToCart('${product.id}'); toggleCartModal(true);" class="w-full py-3.5 px-6 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-semibold shadow-md flex items-center justify-center gap-2">
                               <i data-lucide="shopping-bag" class="w-4 h-4"></i> Beli Sekarang
                           </button>
                       </div>
                   </div>
               </div>
           `;
       }

       function renderCartItems() {
           const container = document.getElementById('cartItemsContainer');
           const subtotalEl = document.getElementById('cartSubtotalText');
           if (!container) return;
           if (state.cart.length === 0) {
               container.innerHTML = `<p class="text-center text-slate-500 py-8">Keranjang belanja kosong.</p>`;
               if (subtotalEl) subtotalEl.innerText = 'Rp 0';
               return;
           }
           let subtotal = 0;
           container.innerHTML = state.cart.map((item, index) => {
               subtotal += item.price_final * item.qty;
               return `
                   <div class="flex items-center gap-4 py-3">
                       <img src="${item.image_url}" class="w-16 h-16 object-cover rounded-xl bg-slate-100">
                       <div class="flex-1">
                           <h4 class="font-bold text-sm text-slate-900 line-clamp-1">${item.title}</h4>
                           <span class="text-xs text-slate-500">Rp ${Number(item.price_final).toLocaleString('id-ID')}</span>
                           <div class="flex items-center gap-2 mt-2">
                               <button onclick="updateCartQty(${index}, -1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold flex items-center justify-center">-</button>
                               <span class="text-xs font-bold">${item.qty}</span>
                               <button onclick="updateCartQty(${index}, 1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold flex items-center justify-center">+</button>
                               <button onclick="removeFromCart(${index})" class="ml-auto text-xs text-red-500 hover:text-red-700 font-semibold flex items-center gap-1">Hapus</button>
                           </div>
                       </div>
                   </div>
               `;
           }).join('');
           if (subtotalEl) subtotalEl.innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
       }

       function updateCartQty(index, delta) {
           state.cart[index].qty += delta;
           if (state.cart[index].qty <= 0) {
               state.cart.splice(index, 1);
           }
           saveCart();
           updateCartBadge();
           renderCartItems();
       }

       function removeFromCart(index) {
           state.cart.splice(index, 1);
           saveCart();
           updateCartBadge();
           renderCartItems();
       }

       function addToCart(productId) {
           const prod = state.products.find(p => p.id === productId);
           if (!prod) return;
           const existing = state.cart.find(item => item.id === productId);
           if (existing) { existing.qty += 1; } else { state.cart.push({ ...prod, qty: 1 }); }
           saveCart();
           updateCartBadge();

       async function processCheckout(e) {
           e.preventDefault();
           saveGuestInputTemp();
           const name = document.getElementById('checkoutName').value;
           const phone = document.getElementById('checkoutPhone').value;
           const address = document.getElementById('checkoutAddress').value;

           const subtotal = state.cart.reduce((sum, item) => sum + (item.price_final * item.qty), 0);
           const grossAmount = subtotal + currentOngkir;
           const orderId = 'ARENZHI-' + Math.floor(100000 + Math.random() * 900000);

           const orderData = {
               order_id: orderId,
               customer_name: name,
               customer_phone: phone,
               shipping_address: address,
               courier: currentCourier,
               tracking_number: 'RES-' + Math.floor(100000000 + Math.random() * 900000000),
               items: state.cart,
               subtotal: subtotal,
               ongkir: currentOngkir,
               gross_amount: grossAmount,
               created_at: new Date().toISOString()
           };

           try {
               const submitBtn = e.target.querySelector('button[type="submit"]');
               if (submitBtn) { submitBtn.innerText = 'Membuat QRIS Dinamis...'; submitBtn.disabled = true; }

               let qrisUrl = null;
               let qrString = null;

               try {
                   const response = await fetch('/api/generate-qris', {
                       method: 'POST',
                       headers: { 'Content-Type': 'application/json' },
                       body: JSON.stringify({
                           order_id: orderId,
                           gross_amount: grossAmount,
                           customer_details: { first_name: name, phone: phone, email: 'customer@arenzhi.com' },
                           item_details: state.cart.map(i => ({ id: i.id, price: i.price_final, quantity: i.qty, name: i.title.substring(0, 50) }))
                       })
                   });
                   const contentType = response.headers.get("content-type");
                   if (contentType && contentType.includes("application/json") && response.ok) {
                       const result = await response.json();
                       qrisUrl = result.actions && result.actions[0] ? result.actions[0].url : null;
                       qrString = result.qr_string || null;
                   }
               } catch (apiErr) {
                   console.log("Backend serverless tidak aktif, menggunakan fallback QRIS lokal.");
               }

               if (!qrisUrl) {
                   qrString = `00020101021226680016ID.CO.MIDTRANS.WWW0118936009140000000000303UAG0215${orderId}53033605802ID5910ArenzhiScent6006Malang6304`;
                   qrisUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(qrString)}`;
               }

               orderData.qris_url = qrisUrl;
               orderData.qr_string = qrString;

               state.orders.push(orderData);
               localStorage.setItem('arenzhi_orders', JSON.stringify(state.orders));
               state.cart = [];
               saveCart();
               updateCartBadge();

               router.navigate('payment', orderId);
           } catch (err) {
               alert('Terjadi kesalahan pembayaran: ' + err.message);
               location.reload();
           }
       }

                       <h3 class="font-bold text-lg text-slate-900 border-b pb-2">Daftar Pesanan Masuk (${state.orders.length})</h3>
                       ${state.orders.length === 0 ? '<p class="text-sm text-slate-500">Belum ada pesanan masuk.</p>' : 
                           state.orders.map((o, idx) => `
                               <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                                   <div class="flex flex-col sm:flex-row justify-between gap-2 border-b pb-3">
                                       <div>
                                           <span class="font-bold text-sm text-slate-900">${o.order_id}</span> - <span class="text-xs font-semibold text-slate-700">${o.customer_name} (${o.customer_phone})</span>
                                           <p class="text-xs text-slate-500 mt-1">Alamat: ${o.shipping_address}</p>
                                           <p class="text-xs text-slate-500">Kurir: <strong>${o.courier}</strong></p>
                                       </div>
                                       <div class="text-right">
                                           <div class="font-bold text-sm text-slate-900">Rp ${Number(o.gross_amount).toLocaleString('id-ID')}</div>
                                           <span class="text-[10px] bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-full font-semibold">Lunas / Order Valid</span>
                                       </div>
                                   </div>

                                   <!-- Detail Produk yang Dibeli -->
                                   <div class="text-xs text-slate-600 space-y-1 bg-white p-3 rounded-xl border">
                                       <span class="font-semibold text-slate-900">Item Pesanan:</span>
                                       ${o.items.map(i => `<div>• ${i.title} (${i.qty}x) @Rp ${Number(i.price_final).toLocaleString('id-ID')}</div>`).join('')}
                                       <div><strong>Ongkir (${o.courier}):</strong> Rp ${Number(o.ongkir).toLocaleString('id-ID')}</div>
                                   </div>

                                   <!-- INPUT RESI, TOMBOL SIMPAN RESI, PDF, KIRIM WA, DAN HAPUS -->
                                   <div class="flex flex-col sm:flex-row items-center gap-3 pt-2">
                                       <div class="flex-1 w-full">
                                           <label class="block text-[11px] font-semibold text-slate-700 mb-1">Nomor Resi Pengiriman</label>
                                           <input type="text" id="resi-${o.order_id}" value="${o.tracking_number || ''}" placeholder="Masukkan nomor resi (cth: JNE123456)" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs focus:outline-none focus:border-slate-900">
                                       </div>
                                       <div class="w-full sm:w-auto sm:self-end flex flex-wrap gap-2">
                                           <button onclick="saveTrackingNumber('${o.order_id}')" class="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-semibold shadow-md flex items-center justify-center gap-1.5">
                                               <i data-lucide="check" class="w-3.5 h-3.5"></i> Simpan Resi
                                           </button>
                                           <button onclick="downloadPdfInvoice('${o.order_id}')" class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold shadow-md flex items-center justify-center gap-1.5">
                                               <i data-lucide="printer" class="w-3.5 h-3.5"></i> Unduh / Cetak PDF
                                           </button>
                                           <button onclick="sendInvoiceWhatsApp('${o.order_id}')" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold shadow-md flex items-center justify-center gap-1.5">
                                               <i data-lucide="send" class="w-3.5 h-3.5"></i> Kirim WA & Faktur
                                           </button>
                                           <button onclick="deleteOrder('${o.order_id}')" class="px-3 py-2.5 bg-red-500 hover:bg-red-600 text-white rounded-xl text-xs font-semibold shadow-md flex items-center justify-center gap-1.5" title="Hapus Pesanan">
                                               <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                           </button>
                                       </div>
                                   </div>
                               </div>
                           `).join('')}
                   </div>
               </div>
           `;
       }

       function saveTrackingNumber(orderId) {
           const resiInput = document.getElementById(`resi-${orderId}`);
           if (!resiInput) return;
           const trackingNumber = resiInput.value.trim();
           
           const order = state.orders.find(o => o.order_id === orderId);
           if (order) {
               order.tracking_number = trackingNumber;
               localStorage.setItem('arenzhi_orders', JSON.stringify(state.orders));
               alert(`Nomor resi ${trackingNumber || '(Kosong)'} untuk pesanan ${orderId} berhasil disimpan!`);
           }
       }

       // --- FUNGSI HAPUS PESANAN MASUK ---
       function deleteOrder(orderId) {
           if (!confirm(`Apakah Anda yakin ingin menghapus pesanan ${orderId} dari daftar?`)) return;
           state.orders = state.orders.filter(o => o.order_id !== orderId);
           localStorage.setItem('arenzhi_orders', JSON.stringify(state.orders));
           alert(`Pesanan ${orderId} berhasil dihapus.`);
           router.navigate('admin');
       }

       // --- FUNGSI UTAMA CETAK / SIMPAN FAKTUR PDF DENGAN ID "printableInvoice" (DIJAMIN TIDAK KOSONG) ---
       function downloadPdfInvoice(orderId) {
           const order = state.orders.find(o => o.order_id === orderId);
           if (!order) return;

           const resiInput = document.getElementById(`resi-${orderId}`);
           const trackingNumber = resiInput ? resiInput.value.trim() : (order.tracking_number || '-');
           order.tracking_number = trackingNumber;
           localStorage.setItem('arenzhi_orders', JSON.stringify(state.orders));

           const s = state.storeSettings;

           // Hapus elemen kontainer cetak lama jika masih ada di DOM
           const oldContainer = document.getElementById('printableInvoice');
           if (oldContainer) oldContainer.remove();

           const container = document.createElement('div');
           container.id = 'printableInvoice';
           container.style.width = '210mm';
           container.style.margin = '0 auto';
           container.style.backgroundColor = '#ffffff';
           container.style.padding = '20mm';
           container.style.fontFamily = "'Plus Jakarta Sans', sans-serif";
           container.style.color = '#1e293b';

           let logoHtml = `<div style="width: 50px; height: 50px; background: #0f172a; color: #ffffff; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px;">${(s.store_name || 'A').charAt(0)}</div>`;
           if (s.store_logo_url) {
               logoHtml = `<div style="width: 50px; height: 50px; border-radius: 10px; overflow: hidden;"><img src="${s.store_logo_url}" style="width:100%; height:100%; object-fit:cover;"></div>`;
           }

           let itemsRows = order.items.map(i => `
               <tr style="border-bottom: 1px solid #f1f5f9;">
                   <td style="padding: 10px; color: #1e293b; font-weight: 500;">${i.title} (${i.size_ml || ''})</td>
                   <td style="padding: 10px; text-align: center; color: #475569;">${i.qty}</td>
                   <td style="padding: 10px; text-align: right; color: #475569;">Rp ${Number(i.price_final).toLocaleString('id-ID')}</td>
                   <td style="padding: 10px; text-align: right; font-weight: 600; color: #1e293b;">Rp ${Number(i.price_final * i.qty).toLocaleString('id-ID')}</td>
               </tr>
           `).join('');

           container.innerHTML = `
               <div style="max-width: 170mm; margin: 0 auto;">
                   <!-- Header Identitas Toko -->
                   <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0f172a; padding-bottom: 15px; margin-bottom: 20px;">
                       <div style="display: flex; align-items: center; gap: 12px;">
                           ${logoHtml}
                           <div>
                               <h2 style="font-size: 20px; font-weight: 800; color: #0f172a; margin: 0; line-height: 1.2;">${s.store_name || 'Arenzhi Scent'}</h2>
                               <p style="font-size: 10px; color: #64748b; margin: 2px 0 0 0; max-width: 250px;">${s.store_address || ''}</p>
                           </div>
                       </div>
                       <div style="text-align: right;">
                           <h1 style="font-size: 22px; font-weight: 800; color: #0f172a; margin: 0; letter-spacing: -0.5px;">FAKTUR PENJUALAN</h1>
                           <p style="font-size: 11px; color: #64748b; margin: 4px 0 0 0;">ID Pesanan: ${order.order_id}</p>
                       </div>
                   </div>

                   <!-- Tabel Informasi Pelanggan & Kurir Pengiriman -->
                   <div style="display: flex; justify-content: space-between; background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 11px;">
                       <div>
                           <p style="font-weight: bold; color: #0f172a; margin: 0 0 4px 0;">INFORMASI PELANGGAN:</p>
                           <p style="font-weight: 600; margin: 0; color: #1e293b;">${order.customer_name}</p>
                           <p style="margin: 2px 0; color: #475569;">No HP: ${order.customer_phone}</p>
                           <p style="margin: 2px 0 0 0; color: #475569; max-width: 280px;">Alamat: ${order.shipping_address}</p>
                       </div>
                       <div style="text-align: right;">
                           <p style="font-weight: bold; color: #0f172a; margin: 0 0 4px 0;">INFORMASI PENGIRIMAN:</p>
                           <p style="margin: 0; color: #475569;">Kurir: <strong>${order.courier}</strong></p>
                           <p style="margin: 2px 0; color: #475569;">No. Resi: <strong style="color: #0f172a;">${trackingNumber || '-'}</strong></p>
                           <p style="margin: 2px 0 0 0; color: #475569;">Tanggal: ${new Date(order.created_at).toLocaleDateString('id-ID', { dateStyle: 'long' })}</p>
                       </div>
                   </div>

                   <!-- Rincian Tabel Produk yang Dibeli -->
                   <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 11px;">
                       <thead>
                           <tr style="background: #0f172a; color: #ffffff;">
                               <th style="padding: 10px; text-align: left;">Nama Produk Parfum</th>
                               <th style="padding: 10px; text-align: center;">Qty</th>
                               <th style="padding: 10px; text-align: right;">Harga Satuan</th>
                               <th style="padding: 10px; text-align: right;">Subtotal</th>
                           </tr>
                       </thead>
                       <tbody>
                           ${itemsRows}
                       </tbody>
                   </table>

                   <!-- Rincian Total Pembayaran Akhir -->
                   <div style="display: flex; justify-content: flex-end; margin-bottom: 30px;">
                       <div style="width: 220px; font-size: 11px;">
                           <div style="display: flex; justify-content: space-between; padding: 4px 0; color: #475569;">
                               <span>Subtotal Produk:</span>
                               <strong>Rp ${Number(order.subtotal).toLocaleString('id-ID')}</strong>
                           </div>
                           <div style="display: flex; justify-content: space-between; padding: 4px 0; color: #475569;">
                               <span>Ongkir (${order.courier}):</span>
                               <strong>Rp ${Number(order.ongkir).toLocaleString('id-ID')}</strong>
                           </div>
                           <div style="display: flex; justify-content: space-between; padding: 8px 0; border-top: 2px solid #0f172a; font-size: 13px; font-weight: bold; color: #0f172a;">
                               <span>Total Tagihan:</span>
                               <span>Rp ${Number(order.gross_amount).toLocaleString('id-ID')}</span>
                           </div>
                       </div>
                   </div>

                   <!-- Footer Faktur -->
                   <div style="border-top: 1px solid #e2e8f0; padding-top: 15px; text-align: center; font-size: 10px; color: #94a3b8;">
                       <p style="margin: 0; font-weight: 600; color: #1e293b;">Terima kasih telah berbelanja di ${s.store_name || 'Arenzhi Scent'}!</p>
                       <p style="margin: 2px 0 0 0;">Faktur digital profesional ini diterbitkan secara resmi oleh sistem toko.</p>
                   </div>
               </div>
           `;

           document.body.appendChild(container);

           // Memunculkan jendela dialog cetak browser (Pilih "Save as PDF" pada tujuan printer)
           setTimeout(() => {
               window.print();
               setTimeout(() => {
                   container.remove();
               }, 500);
           }, 200);
       }

       function sendInvoiceWhatsApp(orderId) {
           const order = state.orders.find(o => o.order_id === orderId);
           if (!order) return;

           const resiInput = document.getElementById(`resi-${orderId}`);
           const trackingNumber = resiInput ? resiInput.value.trim() : (order.tracking_number || '');

           order.tracking_number = trackingNumber;
           localStorage.setItem('arenzhi_orders', JSON.stringify(state.orders));

           let itemsText = order.items.map(i => `• ${i.title} (${i.qty}x) - Rp ${Number(i.price_final * i.qty).toLocaleString('id-ID')}`).join('\n');
           
           const message = `✨ *FAKTUR & RESI RESMI - ${state.storeSettings.store_name}* ✨\n\nHalo Kak *${order.customer_name}*,\nTerima kasih telah berbelanja parfum eksklusif di toko kami! 🛍️\n\n*ID Pesanan:* ${order.order_id}\n*Kurir:* ${order.courier}\n*No. Resi Pengiriman:* *${trackingNumber || 'Segera Diperbarui'}*\n*Alamat Tujuan:* ${order.shipping_address}\n\n*Rincian Pesanan:*\n${itemsText}\n• Ongkir (${order.courier}): Rp ${Number(order.ongkir).toLocaleString('id-ID')}\n\n*Total Tagihan: Rp ${Number(order.gross_amount).toLocaleString('id-ID')}*\nStatus Pembayaran: *LUNAS (Verified)*\n\nTerima kasih atas kepercayaan Anda kepada *${state.storeSettings.store_name}*! 🙏✨`;

           let phone = order.customer_phone.replace(/\D/g, '');
           if (phone.startsWith('0')) {
               phone = '62' + phone.substring(1);
           }

           const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
           window.open(waUrl, '_blank');
           
           downloadPdfInvoice(orderId);
       }

       function convertFileToBase64(file) {
           return new Promise((resolve, reject) => {
               const reader = new FileReader();
               reader.readAsDataURL(file);
               reader.onload = () => resolve(reader.result);
               reader.onerror = error => reject(error);
           });
       }

       async function saveStoreSettings(e) {
           e.preventDefault();
           state.storeSettings.store_name = document.getElementById('adminStoreName').value;
           state.storeSettings.admin_wa_number = document.getElementById('adminWa').value;
           state.storeSettings.store_address = document.getElementById('adminAddress').value;
           state.storeSettings.payment_info = document.getElementById('adminPayment').value;
           
           const logoFileInput = document.getElementById('adminLogoFile');
           const logoUrlInput = document.getElementById('adminLogoUrl').value;

           if (logoFileInput.files && logoFileInput.files[0]) {
               state.storeSettings.store_logo_url = await convertFileToBase64(logoFileInput.files[0]);
           } else if (logoUrlInput) {
               state.storeSettings.store_logo_url = logoUrlInput;
           }

           localStorage.setItem('arenzhi_settings', JSON.stringify(state.storeSettings));
           renderAppHeader();
           updateFloatingWaLink();
           alert('Pengaturan toko berhasil disimpan!');
           router.navigate('admin');
       }

       async function handleProductSubmit(e) {
           e.preventDefault();
           const editId = document.getElementById('editProductId').value;
           const title = document.getElementById('newProdTitle').value;
           const size = document.getElementById('newProdSize').value;
           const priceOriginal = Number(document.getElementById('newProdPrice').value);
           const discount = Number(document.getElementById('newProdDiscount').value) || 0;
           const stock = Number(document.getElementById('newProdStock').value) || 20;
           const desc = document.getElementById('newProdDesc').value;
           const urlInput = document.getElementById('newProdImage').value;
           const fileInput = document.getElementById('newProdFile');

           let imageUrl = urlInput || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=600';
           if (fileInput.files && fileInput.files[0]) {
               imageUrl = await convertFileToBase64(fileInput.files[0]);
           }

           const priceFinal = discount > 0 ? priceOriginal - (priceOriginal * discount / 100) : priceOriginal;
           const isPromo = discount > 0;

           const productData = {
               id: editId || ('prod-' + Date.now()),
               title: title,
               size_ml: size,
               price_original: priceOriginal,
               discount_percent: discount,
               price_final: priceFinal,
               is_promo: isPromo,
               image_url: imageUrl,
               description: desc,
               stock: stock
           };

           try {
               await supabaseClient.from('products').upsert(productData);
               if (editId) {
                   const index = state.products.findIndex(p => p.id === editId);
                   if (index !== -1) state.products[index] = productData;
                   alert('Produk berhasil diperbarui!');
               } else {
                   state.products.unshift(productData);
                   alert('Produk baru berhasil ditambahkan!');
               }
               resetProductForm();
               router.navigate('admin');
           } catch (err) {
               alert('Gagal menyimpan produk: ' + err.message);
           }
       }

       function startEditProduct(productId) {
           const p = state.products.find(item => item.id === productId);
           if (!p) return;
           document.getElementById('editProductId').value = p.id;
           document.getElementById('newProdTitle').value = p.title;
           document.getElementById('newProdSize').value = p.size_ml || '';
           document.getElementById('newProdPrice').value = p.price_original;
           document.getElementById('newProdDiscount').value = p.discount_percent || 0;
           document.getElementById('newProdStock').value = p.stock || 20;
           document.getElementById('newProdDesc').value = p.description || '';
           document.getElementById('newProdImage').value = p.image_url || '';
           
           document.getElementById('productFormTitle').innerText = 'Edit Produk Parfum';
           document.getElementById('productSubmitBtn').innerText = 'Update Perubahan Produk';
           document.getElementById('cancelEditBtn').classList.remove('hidden');
           window.scrollTo({ top: 400, behavior: 'smooth' });
       }

       function resetProductForm() {
           document.getElementById('editProductId').value = ``;
           document.getElementById('productFormTitle').innerText = 'Tambah Produk Parfum Baru';
           document.getElementById('productSubmitBtn').innerText = 'Simpan & Tambah Produk';
           document.getElementById('cancelEditBtn').classList.add('hidden');
           document.querySelector('form').reset();
       }

       async function deleteProduct(productId) {
           if (!confirm('Apakah Anda yakin ingin menghapus produk ini?')) return;
           try {
               await supabaseClient.from('products').delete().eq('id', productId);
               state.products = state.products.filter(p => p.id !== productId);
               alert('Produk berhasil dihapus!');
               router.navigate('admin');
           } catch (err) {
               alert('Gagal menghapus produk: ' + err.message);
           }
       }

       function renderInvoiceView(orderId) {
           return `<div id="printableInvoice" class="max-w-xl mx-auto bg-white p-8 rounded-3xl shadow-sm">Invoice Pesanan: ${orderId}</div>`;
       }
   </script>
</body>
</html>
