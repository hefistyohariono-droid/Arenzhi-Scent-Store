<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arenzhi Scent - Official Perfume Catalog & Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PWA Manifest Data URI -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Arenzhi Scent","short_name":"Arenzhi","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#0f172a","icons":[{"src":"https://api.iconify.design/lucide:sparkles.svg?color=%230f172a","sizes":"192x192","type":"image/svg+xml"}]}'>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printableInvoice, #printableInvoice * { visibility: visible; }
            #printableInvoice { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-slate-900 selection:text-white">

    <!-- HEADER / NAVIGATION -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Brand Logo & Name -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigate('home')">
                <div id="brandLogoContainer" class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-lg shadow-md overflow-hidden flex-shrink-0">
                    <span id="brandLogoInitial">A</span>
                </div>
                <div>
                    <h1 id="brandTitleText" class="font-bold text-base sm:text-lg text-slate-900 tracking-tight leading-none">Arenzhi Scent</h1>
                    <span class="text-[11px] text-slate-500 font-medium">Luxury Fragrance Store</span>
                </div>
            </div>

            <!-- Search & Actions -->
            <div class="flex items-center gap-2 sm:gap-3">
                <div class="relative hidden sm:block">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Cari aroma parfum..." class="pl-9 pr-4 py-2 bg-slate-100 border border-transparent rounded-full text-sm focus:bg-white focus:border-slate-900 focus:outline-none w-44 lg:w-64 transition-all">
                </div>

                <!-- Cart Button -->
                <button onclick="toggleCartModal(true)" class="relative p-2.5 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-700 transition-colors">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-slate-900 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow-sm hidden">0</span>
                </button>

                <!-- Admin Mode Toggle -->
                <button onclick="openAdminAuthModal()" class="flex items-center gap-2 px-3 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-full text-xs font-semibold shadow-sm transition-all">
                    <i data-lucide="shield" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">Admin Mode</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <div id="appView">
            <!-- Initial Loading Skeleton -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 animate-pulse">
                <div class="bg-slate-200 h-72 rounded-2xl"></div>
                <div class="bg-slate-200 h-72 rounded-2xl"></div>
                <div class="bg-slate-200 h-72 rounded-2xl"></div>
                <div class="bg-slate-200 h-72 rounded-2xl"></div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-8 mt-16 text-center text-sm text-slate-500">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>&copy; 2026 <span id="footerBrandName">Arenzhi Scent</span>. All rights reserved.</p>
            <div class="flex items-center gap-6 text-xs font-medium text-slate-600">
                <a href="#" onclick="router.navigate('home'); return false;" class="hover:text-slate-900">Katalog</a>
                <a href="#" onclick="toggleCartModal(true); return false;" class="hover:text-slate-900">Keranjang</a>
                <a href="#" onclick="openAdminAuthModal(); return false;" class="hover:text-slate-900">Panel Admin</a>
            </div>
        </div>
    </footer>

    <!-- CART SIDEBAR MODAL -->
    <div id="cartModal" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity" onclick="toggleCartModal(false)"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i data-lucide="shopping-bag" class="w-5 h-5 text-slate-900"></i>
                        <h3 class="font-bold text-lg text-slate-900">Keranjang Belanja</h3>
                    </div>
                    <button onclick="toggleCartModal(false)" class="p-2 text-slate-400 hover:text-slate-700 rounded-full">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-6 space-y-4 divide-y divide-slate-100">
                    <!-- Cart items inject here -->
                </div>
                <div class="p-6 border-t border-slate-100 bg-slate-50">
                    <div class="flex items-center justify-between mb-4 font-semibold text-slate-900">
                        <span>Subtotal</span>
                        <span id="cartSubtotalText">Rp 0</span>
                    </div>
                    <button onclick="proceedToCheckout()" class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-semibold shadow-md transition-all flex items-center justify-center gap-2">
                        <span>Lanjut ke Checkout</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOMBOL WHATSAPP KONSULTASI MENGAMBANG (FLOATING WA) -->
    <div id="floatingWaContainer" class="fixed bottom-6 right-6 z-50">
        <a id="floatingWaBtn" href="#" target="_blank" class="flex items-center justify-center w-14 h-14 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full shadow-2xl transition-all duration-300 hover:scale-110 group">
            <i data-lucide="message-circle" class="w-7 h-7"></i>
            <span class="absolute right-16 bg-slate-900 text-white text-xs font-semibold px-3 py-1.5 rounded-xl shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap pointer-events-none">
                Konsultasi / Tanya Parfum
            </span>
        </a>
    </div>

    <!-- SCRIPT APPLICATION LOGIC -->
    <script>
        // SUPABASE CLIENT INITIALIZATION
        const SUPABASE_URL = "https://dnizwwfgocdrbevvsiyi.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_jvFwPfnF3xVKVCqkefItzA_GWMMFkwz";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // APPLICATION STATE
        let state = {
            storeSettings: JSON.parse(localStorage.getItem('arenzhi_settings') || JSON.stringify({
                store_name: "Arenzhi Scent",
                store_logo_url: "",
                admin_wa_number: "6285855859088",
                store_address: "Dusun Sumberagung Desa Bandungrejo RT.57/RW.09 Kecamatan Bantur Kabupaten Malang Provinsi Jawa Timur Kode Pos (65179)",
                payment_info: "BRI: 786601020880538 a.n. Robiatul Adabiyah\nTransfer/QRIS Aktif",
                qris_image_url: ""
            })),
            products: [], // Loaded from Supabase
            orders: JSON.parse(localStorage.getItem('arenzhi_orders') || '[]'),
            cart: JSON.parse(localStorage.getItem('arenzhi_cart') || '[]'),
            guestProfile: JSON.parse(localStorage.getItem('arenzhi_guest') || '{}'),
            isAdmin: false,
            currentView: 'home',
            searchQuery: '',
            activeOrder: null
        };

        // TARIF EKSPEDISI BERDASARKAN ZONA WILAYAH
        const shippingRatesByZone = {
            'jatim': { name: 'Jawa Timur (Sesama Prov)', jne: 10000, jnt: 12000, sicepat: 9000, pos: 8000 },
            'jateng_diy': { name: 'Jawa Tengah & DIY', jne: 16000, jnt: 18000, sicepat: 15000, pos: 12000 },
            'jabar_banten_dki': { name: 'Jabar, Banten & DKI Jakarta', jne: 18000, jnt: 20000, sicepat: 17000, pos: 14000 },
            'luar_jawa': { name: 'Luar Pulau Jawa (Sumatra/Bali/Dll)', jne: 35000, jnt: 40000, sicepat: 35000, pos: 30000 }
        };

        let currentZone = 'jatim';
        let currentCourier = 'JNE';
        let currentOngkir = 10000;

        // INITIALIZATION
        document.addEventListener('DOMContentLoaded', async () => {
            await fetchProductsFromSupabase();
            loadLocalStorageGuestProfile();
            renderAppHeader();
            updateFloatingWaLink();
            router.navigate(state.currentView);
            updateCartBadge();
            lucide.createIcons();
        });

        // FETCH PRODUCTS FROM SUPABASE
        async function fetchProductsFromSupabase() {
            try {
                const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                if (data && data.length > 0) {
                    state.products = data;
                } else {
                    const defaultProds = [
                        { id: '1', title: 'Arenzhi Velvet Noir Extrait', size_ml: '50ml', description: 'Parfum mewah beraroma woody amber dengan sentuhan vanilla hangat dan musk eksklusif.', price_original: 450000, discount_percent: 20, price_final: 360000, is_promo: true, image_url: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=600', stock: 25 },
                        { id: '2', title: 'Arenzhi Celestial Rose', size_ml: '30ml', description: 'Keharuman bunga mawar Grasse berpadu segar dengan citrus dan white musk.', price_original: 380000, discount_percent: 0, price_final: 380000, is_promo: false, image_url: 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=600', stock: 15 },
                        { id: '3', title: 'Arenzhi Ocean Breeze Elixir', size_ml: '100ml', description: 'Aroma aquatic segar yang membangkitkan semangat dengan sentuhan marine salt dan cedarwood.', price_original: 420000, discount_percent: 15, price_final: 357000, is_promo: true, image_url: 'https://images.unsplash.com/photo-1541643600914-78b084683601?w=600', stock: 30 },
                        { id: '4', title: 'Arenzhi Amber Tobacco Royal', size_ml: '50ml', description: 'Kombinasi hangat tembakau lembut, rempah oriental, dan madu manis mewah.', price_original: 500000, discount_percent: 10, price_final: 450000, is_promo: true, image_url: 'https://images.unsplash.com/photo-1594035910387-fea47794261f?w=600', stock: 10 }
                    ];
                    for (let p of defaultProds) {
                        await supabaseClient.from('products').upsert(p);
                    }
                    state.products = defaultProds;
                }
            } catch (err) {
                console.error("Gagal memuat produk dari Supabase, menggunakan cache lokal:", err);
                state.products = JSON.parse(localStorage.getItem('arenzhi_products') || '[]');
            }
        }

        function updateFloatingWaLink() {
            const waNumber = state.storeSettings.admin_wa_number || "6285855859088";
            const defaultMsg = encodeURIComponent("Halo Admin " + state.storeSettings.store_name + ", saya ingin konsultasi dan bertanya seputar produk parfum.");
            const floatingBtn = document.getElementById('floatingWaBtn');
            if (floatingBtn) {
                floatingBtn.href = `https://wa.me/${waNumber}?text=${defaultMsg}`;
            }
        }

        function renderAppHeader() {
            const name = state.storeSettings.store_name || "Arenzhi Scent";
            document.getElementById('brandTitleText').innerText = name;
            document.getElementById('footerBrandName').innerText = name;
            const logoContainer = document.getElementById('brandLogoContainer');
            if (state.storeSettings.store_logo_url) {
                logoContainer.innerHTML = `<img src="${state.storeSettings.store_logo_url}" class="w-full h-full object-cover" alt="Logo">`;
            } else {
                logoContainer.innerHTML = `<span id="brandLogoInitial">${name.charAt(0).toUpperCase()}</span>`;
            }
            document.title = `${name} - Official Perfume Catalog & Store`;
        }

        // ROUTER HANDLER
        const router = {
            navigate: (viewName, param = null) => {
                state.currentView = viewName;
                window.scrollTo(0, 0);
                const container = document.getElementById('appView');
                
                if (viewName === 'home') container.innerHTML = renderHomeView();
                else if (viewName === 'detail') container.innerHTML = renderDetailView(param);
                else if (viewName === 'checkout') container.innerHTML = renderCheckoutView();
                else if (viewName === 'payment') container.innerHTML = renderPaymentView(param);
                else if (viewName === 'admin') container.innerHTML = renderAdminView();
                else if (viewName === 'invoice') container.innerHTML = renderInvoiceView(param);
                
                lucide.createIcons();
            }
        };

        // VIEWS RENDERING
        function renderHomeView() {
            const filtered = state.products.filter(p => p.title.toLowerCase().includes(state.searchQuery.toLowerCase()));
            return `
                <div class="space-y-8">
                    <!-- Hero Banner -->
                    <div class="relative bg-slate-900 rounded-3xl p-6 sm:p-12 text-white overflow-hidden shadow-xl flex flex-col justify-center min-h-[280px] sm:min-h-[320px]">
                        <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px]"></div>
                        <div class="relative z-10 max-w-xl space-y-4">
                            <span class="px-3 py-1 bg-white/10 backdrop-blur-md rounded-full text-xs font-semibold uppercase tracking-wider text-slate-200">Signature Collection 2026</span>
                            <h2 class="text-2xl sm:text-5xl font-extrabold tracking-tight">Temukan Aroma Khas <span class="text-amber-300">${state.storeSettings.store_name}</span></h2>
                            <p class="text-slate-300 text-xs sm:text-base leading-relaxed">Racikan parfum eksklusif pilihan terbaik untuk menyempurnakan hari dan karakter percaya diri Anda.</p>
                        </div>
                    </div>

                    <!-- Catalog Section -->
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-lg sm:text-xl text-slate-900">Katalog Parfum</h3>
                        <span class="text-xs text-slate-500 font-medium">${filtered.length} Produk Tersedia</span>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                        ${filtered.length === 0 ? '<p class="col-span-full text-center py-12 text-slate-500">Produk tidak ditemukan.</p>' : 
                          filtered.map(p => `
                            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs hover:shadow-lg transition-all overflow-hidden flex flex-col justify-between group">
                                <div class="relative aspect-square bg-slate-100 overflow-hidden cursor-pointer" onclick="router.navigate('detail', '${p.id}')">
                                    <img src="${p.image_url || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=600'}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                    ${p.is_promo && p.discount_percent > 0 ? `<span class="absolute top-3 left-3 bg-red-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-full shadow-sm">Diskon ${p.discount_percent}%</span>` : ''}
                                    ${p.size_ml ? `<span class="absolute bottom-3 right-3 bg-slate-900/80 backdrop-blur-xs text-white text-[10px] font-semibold px-2 py-0.5 rounded-md">${p.size_ml}</span>` : ''}
                                </div>
                                <div class="p-3 sm:p-4 space-y-2 sm:space-y-3 flex-1 flex flex-col justify-between">
                                    <div>
                                        <h4 class="font-bold text-slate-900 text-xs sm:text-sm line-clamp-1 cursor-pointer hover:text-amber-600 transition-colors" onclick="router.navigate('detail', '${p.id}')">${p.title}</h4>
                                        <div class="mt-1 sm:mt-2 flex items-baseline gap-2">
                                            <span class="font-bold text-slate-950 text-sm sm:text-base">Rp ${Number(p.price_final).toLocaleString('id-ID')}</span>
                                            ${p.is_promo && p.price_original > p.price_final ? `<span class="text-[11px] text-slate-400 line-through">Rp ${Number(p.price_original).toLocaleString('id-ID')}</span>` : ''}
                                        </div>
                                    </div>
                                    <button onclick="addToCart('${p.id}')" class="w-full py-2.5 px-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold shadow-sm transition-all flex items-center justify-center gap-1.5">
                                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                        <span>Tambah</span>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderDetailView(productId) {
            const product = state.products.find(p => p.id === productId);
            if (!product) return `<div class="text-center py-20">Produk tidak ditemukan. <button onclick="router.navigate('home')" class="text-blue-600 underline">Kembali</button></div>`;
            return `
                <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-10 shadow-sm max-w-4xl mx-auto">
                    <button onclick="router.navigate('home')" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-slate-900 mb-6">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Katalog
                    </button>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                        <div class="aspect-square rounded-2xl overflow-hidden bg-slate-100 shadow-inner">
                            <img src="${product.image_url}" alt="${product.title}" class="w-full h-full object-cover">
                        </div>
                        <div class="space-y-6">
                            <div>
                                <div class="flex items-center gap-2 mb-2">
                                    ${product.size_ml ? `<span class="bg-slate-100 text-slate-800 text-xs font-bold px-2.5 py-1 rounded-md">Ukuran: ${product.size_ml}</span>` : ''}
                                    ${product.is_promo && product.discount_percent > 0 ? `<span class="bg-red-100 text-red-600 text-xs font-bold px-3 py-1 rounded-full">Diskon ${product.discount_percent}%</span>` : ''}
                                </div>
                                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">${product.title}</h2>
                                <div class="mt-3 flex items-baseline gap-3">
                                    <span class="text-2xl font-bold text-slate-900">Rp ${Number(product.price_final).toLocaleString('id-ID')}</span>
                                    ${product.is_promo && product.price_original > product.price_final ? `<span class="text-sm text-slate-400 line-through">Rp ${Number(product.price_original).toLocaleString('id-ID')}</span>` : ''}
                                </div>
                            </div>
                            <p class="text-slate-600 text-sm leading-relaxed">${product.description || 'Tidak ada deskripsi produk.'}</p>
                            <div class="text-xs text-slate-500 font-medium">Stok Tersedia: <span class="text-slate-900 font-bold">${product.stock} pcs</span></div>
                            <button onclick="addToCart('${product.id}'); toggleCartModal(true);" class="w-full py-3.5 px-6 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-semibold shadow-md transition-all flex items-center justify-center gap-2">
                                <i data-lucide="shopping-bag" class="w-4 h-4"></i> Beli Sekarang
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCheckoutView() {
            if (state.cart.length === 0) {
                return `<div class="text-center py-20 space-y-4">
                    <h3 class="font-bold text-xl text-slate-900">Keranjang Belanja Kosong</h3>
                    <p class="text-slate-500 text-sm">Silakan pilih produk parfum terlebih dahulu.</p>
                    <button onclick="router.navigate('home')" class="px-6 py-2.5 bg-slate-900 text-white rounded-xl text-sm font-semibold">Kembali ke Katalog</button>
                </div>`;
            }

            const subtotal = state.cart.reduce((sum, item) => sum + (item.price_final * item.qty), 0);
            const savedUser = state.guestProfile || {};
            const rates = shippingRatesByZone[currentZone];
            currentOngkir = rates[currentCourier.toLowerCase()] || rates.jne;

            return `
                <div class="max-w-3xl mx-auto space-y-8">
                    <h2 class="text-2xl font-bold text-slate-900">Checkout Pengiriman</h2>
                    <form id="checkoutForm" onsubmit="processCheckout(event)" class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-6">
                        <div class="space-y-4">
                            <h3 class="font-bold text-base text-slate-900 border-b pb-2">1. Informasi Penerima</h3>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                                <input type="text" id="checkoutName" required value="${savedUser.nama || ''}" placeholder="Masukkan nama lengkap" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:border-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor WhatsApp / HP Pembeli</label>
                                <input type="tel" id="checkoutPhone" required value="${savedUser.no_hp || ''}" placeholder="Contoh: 08123456789" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:border-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Alamat Lengkap Pengiriman</label>
                                <textarea id="checkoutAddress" required rows="3" placeholder="Jalan, Nomor Rumah, RT/RW, Kelurahan, Kecamatan, Kabupaten/Kota, Kode Pos" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:border-slate-900">${savedUser.alamat_lengkap || ''}</textarea>
                            </div>
                        </div>

                        <!-- PILIHAN ZONA / PROVINSI TUJUAN -->
                        <div class="space-y-4 pt-2">
                            <h3 class="font-bold text-base text-slate-900 border-b pb-2">2. Pilih Wilayah / Provinsi Tujuan</h3>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Provinsi / Zona Tujuan Pengiriman</label>

            const order = state.orders.find(o => o.order_id === orderId);
            if (!order) return;
            const settings = state.storeSettings;

            const itemsText = order.items.map(i => `- ${i.title} (${i.size_ml || '-'}) x${i.qty} = Rp ${(i.price_final * i.qty).toLocaleString('id-ID')}`).join('%0A');
            const customerPhone = order.no_hp.replace(/^0/, '62');

            const message = `Halo Kak *${order.nama}*, terima kasih telah berbelanja di *${settings.store_name}*! 🎉%0A%0A` +
                `Berikut adalah Nota / Faktur Pesanan Anda:%0A` +
                `*No. Pesanan:* ${order.order_id}%0A` +
                `*Tanggal:* ${order.date || '-'}%0A%0A` +
                `*Rincian Produk:*%0A${itemsText}%0A%0A` +
                `*Subtotal:* Rp ${Number(order.subtotal).toLocaleString('id-ID')}%0A` +
                `*Ongkir (${order.courier}):* Rp ${Number(order.ongkir).toLocaleString('id-ID')}%0A` +
                `*Total Tagihan (Lunas):* Rp ${Number(order.total_amount).toLocaleString('id-ID')}%0A%0A` +
                `📦 *Informasi Pengiriman:*%0A` +
                `Kurir: ${order.courier}%0A` +
                `No. Resi: *${order.no_resi || 'Sedang diproses'}*%0A` +
                `Alamat: ${order.alamat_lengkap}%0A%0A` +
                `Pesanan sedang dalam perjalanan. Terima kasih atas kepercayaan Anda kepada ${settings.store_name}! 🙏`;

            const waUrl = `https://wa.me/${customerPhone}?text=${message}`;
            window.open(waUrl, '_blank');
        }

        async function handleSaveNewProductToSupabase(event) {
            event.preventDefault();
            const title = document.getElementById('newProdTitle').value;
            const size_ml = document.getElementById('newProdSize').value;
            const stock = Number(document.getElementById('newProdStock').value);
            const price_original = Number(document.getElementById('newProdPrice').value);
            const discount_percent = Number(document.getElementById('newProdDiscount').value);
            const description = document.getElementById('newProdDesc').value;
            const fileInput = document.getElementById('newProdImageFile');

            const price_final = price_original - (price_original * (discount_percent / 100));

            const saveToSupabase = async (imageUrl) => {
                const newProduct = {
                    id: Date.now().toString(),
                    title,
                    size_ml,
                    description,
                    price_original,
                    discount_percent,
                    price_final,
                    is_promo: discount_percent > 0,
                    image_url: imageUrl || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=600',
                    stock
                };

                const { error } = await supabaseClient.from('products').insert([newProduct]);
                if (error) {
                    alert("Gagal menyimpan ke Supabase: " + error.message);
                    return;
                }

                state.products.unshift(newProduct);
                closeAddProductModal();
                router.navigate('admin');
                alert("Produk baru berhasil disimpan ke Cloud Database secara live!");
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveToSupabase(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveToSupabase('');
            }
        }

        async function handleUpdateProductInSupabase(event, productId) {
            event.preventDefault();
            const title = document.getElementById('editProdTitle').value;
            const size_ml = document.getElementById('editProdSize').value;
            const stock = Number(document.getElementById('editProdStock').value);
            const price_original = Number(document.getElementById('editProdPrice').value);
            const discount_percent = Number(document.getElementById('editProdDiscount').value);
            const description = document.getElementById('editProdDesc').value;
            const fileInput = document.getElementById('editProdImageFile');

            const price_final = price_original - (price_original * (discount_percent / 100));
            const existingProduct = state.products.find(p => p.id === productId);

            const updateInSupabase = async (imageUrl) => {
                const updatedData = {
                    title,
                    size_ml,
                    description,
                    price_original,
                    discount_percent,
                    price_final,
                    is_promo: discount_percent > 0,
                    image_url: imageUrl,
                    stock
                };

                const { error } = await supabaseClient.from('products').update(updatedData).eq('id', productId);
                if (error) {
                    alert("Gagal memperbarui produk: " + error.message);
                    return;
                }

                const index = state.products.findIndex(p => p.id === productId);
                if (index !== -1) {
                    state.products[index] = { ...state.products[index], ...updatedData };
                }

                closeEditProductModal();
                router.navigate('admin');
                alert("Produk berhasil diperbarui di Cloud Database!");
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    updateInSupabase(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                updateInSupabase(existingProduct.image_url);
            }
        }

        async function deleteProductFromSupabase(id) {
            if (confirm("Hapus produk ini dari database cloud?")) {
                const { error } = await supabaseClient.from('products').delete().eq('id', id);
                if (error) {
                    alert("Gagal menghapus produk: " + error.message);
                    return;
                }
                state.products = state.products.filter(p => p.id !== id);
                router.navigate('admin');
                alert("Produk berhasil dihapus dari cloud.");
            }
        }

        function toggleCartModal(show) {

        function addToCart(productId) {
            const product = state.products.find(p => p.id === productId);
            if (!product) return;
            const existing = state.cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                state.cart.push({ ...product, qty: 1 });
            }
            saveCartToLocalStorage();
            updateCartBadge();
            alert(`Berhasil menambahkan ${product.title} ke keranjang!`);
        }

        function updateCartQuantity(productId, delta) {
            const item = state.cart.find(i => i.id === productId);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                state.cart = state.cart.filter(i => i.id !== productId);
            }
            saveCartToLocalStorage();
            renderCartItems();
            updateCartBadge();
        }

        function saveCartToLocalStorage() {
            localStorage.setItem('arenzhi_cart', JSON.stringify(state.cart));
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            const totalQty = state.cart.reduce((sum, i) => sum + i.qty, 0);
            if (totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function renderCartItems() {
            const container = document.getElementById('cartItemsContainer');
            const subtotalEl = document.getElementById('cartSubtotalText');
            if (state.cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 text-sm py-8">Keranjang belanja kosong.</p>`;
                subtotalEl.innerText = `Rp 0`;
                return;
            }

            let subtotal = 0;
            container.innerHTML = state.cart.map(item => {
                subtotal += item.price_final * item.qty;
                return `
                    <div class="flex items-center gap-4 py-3">
                        <img src="${item.image_url}" class="w-16 h-16 object-cover rounded-xl bg-slate-100 border">
                        <div class="flex-1">
                            <h4 class="font-bold text-sm text-slate-900">${item.title}</h4>
                            <p class="text-xs text-slate-500">Rp ${Number(item.price_final).toLocaleString('id-ID')} ${item.size_ml ? `(${item.size_ml})` : ''}</p>
                            <div class="flex items-center gap-2 mt-2">
                                <button onclick="updateCartQuantity('${item.id}', -1)" class="w-6 h-6 rounded bg-slate-100 flex items-center justify-center font-bold text-xs">-</button>
                                <span class="text-xs font-semibold">${item.qty}</span>
                                <button onclick="updateCartQuantity('${item.id}', 1)" class="w-6 h-6 rounded bg-slate-100 flex items-center justify-center font-bold text-xs">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            subtotalEl.innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
        }

        function proceedToCheckout() {
            if (state.cart.length === 0) return;
            toggleCartModal(false);
            router.navigate('checkout');
        }

        function processCheckout(event) {
            event.preventDefault();
            const nama = document.getElementById('checkoutName').value;
            const no_hp = document.getElementById('checkoutPhone').value;
            const alamat_lengkap = document.getElementById('checkoutAddress').value;

            state.guestProfile = { nama, no_hp, alamat_lengkap };
            localStorage.setItem('arenzhi_guest', JSON.stringify(state.guestProfile));

            const subtotal = state.cart.reduce((sum, i) => sum + (i.price_final * i.qty), 0);
            const totalAmount = subtotal + currentOngkir;
            const orderId = 'ARENZHI-' + Math.floor(100000 + Math.random() * 900000);

            const selectedZoneData = shippingRatesByZone[currentZone];

            const newOrder = {
                order_id: orderId,
                date: new Date().toLocaleDateString('id-ID'),
                items: [...state.cart],
                subtotal: subtotal,
                ongkir: currentOngkir,
                courier: currentCourier,
                zone_name: selectedZoneData.name,
                total_amount: totalAmount,
                nama,
                no_hp,
                alamat_lengkap,
                status: 'Perlu Dikirim',
                no_resi: ''
            };

            state.orders.unshift(newOrder);
            localStorage.setItem('arenzhi_orders', JSON.stringify(state.orders));

            state.cart = [];
            saveCartToLocalStorage();
            updateCartBadge();
            router.navigate('payment', newOrder);
        }

        // FUNGSI HAPUS PESANAN
        function deleteOrder(orderId) {
            if (confirm(`Apakah Anda yakin ingin menghapus data pesanan ${orderId}?`)) {
                state.orders = state.orders.filter(o => o.order_id !== orderId);
                localStorage.setItem('arenzhi_orders', JSON.stringify(state.orders));
                router.navigate('admin');
                alert("Data pesanan berhasil dihapus.");
            }
        }

        function loadLocalStorageGuestProfile() {
            const saved = localStorage.getItem('arenzhi_guest');
            if (saved) state.guestProfile = JSON.parse(saved);
        }

        function openAdminAuthModal() {
            router.navigate('admin');
        }

        function handleAdminLogin(event) {
            event.preventDefault();
            const emailInput = document.getElementById('adminEmail').value.trim();
            const passInput = document.getElementById('adminPassword').value.trim();

            if (emailInput === "adminarenzhi@gmail.com" && passInput === "Arenzhi170413") {
                state.isAdmin = true;
                alert("Berhasil masuk sebagai Admin " + state.storeSettings.store_name);
                router.navigate('admin');
            } else {
                alert("Email atau Password Admin salah!");
            }
        }

        // SAVE STORE SETTINGS
        function saveStoreSettings(event) {
            event.preventDefault();
            const storeName = document.getElementById('settingStoreName').value;
            const adminWa = document.getElementById('settingAdminWa').value.replace(/[^0-9]/g, '');
            const storeAddress = document.getElementById('settingStoreAddress').value;
            const paymentInfo = document.getElementById('settingPaymentInfo').value;
            const logoFile = document.getElementById('settingLogoFile').files[0];
            const qrisFile = document.getElementById('settingQrisFile').files[0];

            state.storeSettings.store_name = storeName;
            state.storeSettings.admin_wa_number = adminWa;
            state.storeSettings.store_address = storeAddress;
            state.storeSettings.payment_info = paymentInfo;

            let pendingSaves = 0;
            const checkDone = () => {
                pendingSaves--;
                if (pendingSaves <= 0) {
                    localStorage.setItem('arenzhi_settings', JSON.stringify(state.storeSettings));
                    renderAppHeader();
                    updateFloatingWaLink();
                    alert("Pengaturan toko, alamat, & WhatsApp admin berhasil disimpan!");
                    router.navigate('admin');
                }
            };

            if (logoFile) {
                pendingSaves++;
                const reader = new FileReader();
                reader.onload = function(e) {
                    state.storeSettings.store_logo_url = e.target.result;
                    checkDone();
                };
                reader.readAsDataURL(logoFile);
            }

            if (qrisFile) {
                pendingSaves++;
                const reader = new FileReader();
                reader.onload = function(e) {
                    state.storeSettings.qris_image_url = e.target.result;
                    checkDone();
                };
                reader.readAsDataURL(qrisFile);
            }

            if (pendingSaves === 0) {
                localStorage.setItem('arenzhi_settings', JSON.stringify(state.storeSettings));
                renderAppHeader();
                updateFloatingWaLink();
                alert("Pengaturan toko, alamat, & WhatsApp admin berhasil disimpan!");
                router.navigate('admin');
            }
        }

        function handleSearch(query) {
            state.searchQuery = query;
            if (state.currentView === 'home') {
                const container = document.getElementById('appView');
                container.innerHTML = renderHomeView();
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
